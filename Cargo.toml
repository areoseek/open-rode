[package]
name = "rode-central-linux"
version = "0.1.0"
edition = "2021"
description = "Native Linux control app for RØDE wireless microphone systems (Wireless GO II / PRO / Micro / ME)"
license = "MIT"

[[bin]]
name = "rode-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "rode-central"
path = "src/main.rs"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[profile.release]
opt-level = 2
