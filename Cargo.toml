[package]
name = "open-rode"
version = "0.1.0"
edition = "2021"
description = "Open source Linux client for the RODE Wireless GO II"
license = "MIT"
repository = "https://github.com/areoseek/open-rode"

[lib]
name = "open_rode"
path = "src/lib.rs"

[[bin]]
name = "open-rode"
path = "src/main.rs"

[[bin]]
name = "open-rode-cli"
path = "src/bin/probe.rs"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[profile.release]
opt-level = 2
strip = true
